# /etc/nginx/sites-available/outil-devis
# certbot ajoute ensuite lui-même le bloc HTTPS et la redirection depuis HTTP.

limit_req_zone $binary_remote_addr zone=outil_devis_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name devis-brief.monsitedemo-talens.fr;

    # Captures d'écran : jusqu'à 20 fichiers par envoi.
    client_max_body_size 150m;

    # Aucun robot sur un outil interne.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/outil-devis.access.log;
    error_log  /var/log/nginx/outil-devis.error.log;

    location = /api/auth/login {
        limit_req zone=outil_devis_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/outil-devis-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/outil-devis-proxy.conf;
    }
}
